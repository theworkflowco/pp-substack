name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          cache: true

      - name: Test with race detector
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Scan reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

      - name: Scan committed source for secrets
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          "$(go env GOPATH)/bin/gitleaks" git --redact --no-banner .

      - name: Verify required cross-builds
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/pp-substack-darwin-arm64 ./cmd/pp-substack
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/pp-substack-linux-amd64 ./cmd/pp-substack

      - name: Prove release archives are reproducible
        run: |
          go install github.com/goreleaser/goreleaser/v2@v2.17.1
          "$(go env GOPATH)/bin/goreleaser" release --snapshot --clean
          mkdir /tmp/pp-substack-first-build
          cp dist/*.tar.gz /tmp/pp-substack-first-build/
          "$(go env GOPATH)/bin/goreleaser" release --snapshot --clean
          sha256sum /tmp/pp-substack-first-build/*.tar.gz |
            sed 's#/tmp/pp-substack-first-build/##' > /tmp/first.sha256
          sha256sum dist/*.tar.gz |
            sed 's#dist/##' > /tmp/second.sha256
          diff -u /tmp/first.sha256 /tmp/second.sha256

      - name: Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
